# /etc/nginx/conf.d/cnb-imgsanitize.conf
#
# Upstream block for the request relay (imgsanitize.py) listening on 127.0.0.1:9004.
# No `keepalive` directive: the relay answers every response with
# `Connection: close` (each request is self-contained and the process drains
# cleanly on SIGTERM), so an idle-connection pool would never be reused.
upstream cnb_imgsanitize {
    server 127.0.0.1:9004;
}
