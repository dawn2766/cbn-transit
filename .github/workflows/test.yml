name: test

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # image_budget.py imports PIL; everything else is stdlib.
      - name: Install dependencies
        run: pip install pillow

      - name: Offline regression suite
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile Python entry points
        run: python -m py_compile deploy/cnb-register.py deploy/imgsanitize.py deploy/image_budget.py

      - name: Syntax-check shell scripts
        run: bash -n deploy/cnb-ai-watchdog.sh install.sh smoke-test.sh
