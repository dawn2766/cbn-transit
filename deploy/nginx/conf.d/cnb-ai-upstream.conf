# /etc/nginx/conf.d/cnb-ai-upstream.conf
#
# The single mutable pointer of the relay: which CNB workspace subdomain the
# fixed domain currently forwards to. Owned and rewritten atomically by
# cnb-register.py; seed it once (before enabling the vhost that references
# $cnb_ai_upstream) so `nginx -t` has the variable defined.
#
# The default value is a placeholder; the first successful registration replaces
# it with https://<business_id>-<port>.cnb.run:443.
# Never commit the real live subdomain: it identifies your running workspace.
map $request_uri $cnb_ai_upstream { default placeholder-9001.cnb.run:443; }
